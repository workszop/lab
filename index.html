<style>
/* ============================================================
   edulab — Colors & Type foundation
   Fonts loaded from Google Fonts (CDN). See README "Visual
   Foundations" for substitution notes.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap');

:root {
  /* ---- Brand fonts ---- */
  --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
  --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ============================================================
     RAW COLOR TOKENS
     ============================================================ */

  /* Paper — page background is white; the sand steps are wells/alternating sections */
  --paper:    #FFFFFF;   /* page background (white)    */
  --paper-2:  #FBF7E6;   /* alternating section        */
  --paper-3:  #F5EDCB;   /* deepest sand / wells       */
  --surface:  #FFFFFF;   /* cards & sheets             */

  /* Ink — warm near-black text & lines */
  --ink:      #1C1917;   /* primary text               */
  --ink-2:    #57534E;   /* secondary text             */
  --ink-3:    #948C82;   /* muted / placeholder        */
  --line:     #EDE7D2;   /* hairline borders           */
  --line-2:   #DDD4B6;   /* stronger borders           */

  /* ---- Brand: Yellow main · Blue + Green secondary · Red danger ----
     Plain saturated colours. A "-soft" tint IS the saturated colour
     (panels and chips are solid), "-ink" is the text colour ON it:
     white on blue/green/red, dark ink on yellow. Never colour-on-colour
     (no green text on green); the saturated colour itself goes only on
     white or black. */

  /* Yellow — primary (buttons, progress, values on dark panels) */
  --yellow:      #FFD500;
  --yellow-600:  #F0C800;  /* hover / press          */
  --yellow-soft: #FFD500;  /* chip / panel fill      */
  --yellow-ink:  #1C1917;  /* text on yellow         */

  /* Blue — secondary (panels, chips, correct / selected state) */
  --blue:      #1E8FC2;
  --blue-600:  #177AA8;
  --blue-soft: #1E8FC2;
  --blue-ink:  #FFFFFF;

  /* Green — secondary support (chips, success) */
  --green:      #00A651;
  --green-600:  #009444;
  --green-soft: #00A651;
  --green-ink:  #FFFFFF;

  /* Red — danger / important / wrong (use sparingly) */
  --red:      #E5322D;
  --red-600:  #C92823;
  --red-soft: #E5322D;
  --red-ink:  #FFFFFF;

  /* Legacy role aliases — older edulab apps use these names */
  --marigold: var(--yellow); --marigold-600: var(--yellow-600); --marigold-soft: var(--yellow-soft); --marigold-ink: var(--yellow-ink);
  --teal:     var(--blue);   --teal-600:     var(--blue-600);   --teal-soft:     var(--blue-soft);   --teal-ink:     var(--blue-ink);
  --sky:      var(--green);                                     --sky-soft:      var(--green-soft);  --sky-ink:      var(--green-ink);
  --coral:    var(--red);    --coral-600:    var(--red-600);    --coral-soft:    var(--red-soft);    --coral-ink:    var(--red-ink);

  /* Play palette — subject/category colours in the kids app */
  --play-sun:    #FFD500;
  --play-grass:  #00A651;
  --play-berry:  #C6478B;
  --play-grape:  #7A5AC2;
  --play-sky:    #1E8FC2;
  --play-coral:  #E5322D;

  /* ---- Semantic ---- */
  --success:      #00A651;  --success-soft: #00A651;  --success-ink: #FFFFFF;
  --warning:      #FFD500;  --warning-soft: #FFD500;  --warning-ink: #1C1917;
  --danger:       #E5322D;  --danger-soft:  #E5322D;  --danger-ink:  #FFFFFF;
  --info:         #1E8FC2;  --info-soft:    #1E8FC2;  --info-ink:    #FFFFFF;

  /* ---- Functional aliases ---- */
  --bg:        var(--paper);
  --fg:        var(--ink);
  --fg-muted:  var(--ink-2);
  --primary:   var(--yellow);
  --on-primary:#1C1917;      /* dark text on yellow */
  --focus-ring: 0 0 0 3px color-mix(in srgb, var(--yellow) 45%, transparent);

  /* ============================================================
     SPACING  (4pt base)
     ============================================================ */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;

  /* ---- Radii (friendly, generous) ---- */
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  /* ---- Elevation — warm, low, soft ---- */
  --shadow-sm: 0 1px 2px rgba(33,30,26,.06), 0 1px 1px rgba(33,30,26,.04);
  --shadow-md: 0 4px 16px rgba(33,30,26,.08), 0 1px 3px rgba(33,30,26,.05);
  --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
  --shadow-primary:  0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);
  --shadow-marigold: var(--shadow-primary);   /* legacy alias */

  /* ============================================================
     TYPE SCALE (semantic sizes)
     ============================================================ */
  --display-font:  clamp(48px, 6vw, 72px);
  --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
  --body-lg: 18px; --body: 16px; --body-sm: 14px;
  --caption: 13px; --overline: 12px;
}

/* ─── Base ─── */
* { margin: 0; padding: 0; box-sizing: border-box; }
body.edu {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--r-sm); }

/* ─── Branded top menu ─── */
.edu-header {
  position: sticky; top: 0; z-index: 50; width: 100%;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.edu-header-inner {
  max-width: 1100px; margin: 0 auto;
  padding: 8px 30px; display: flex; align-items: center; gap: 12px;
}
.edu-logo { width: 64px; height: 64px; display: block; margin-right: -6px; }
.edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }

.edu-seg { margin-left: auto; display: inline-flex; gap: 2px; padding: 3px; background: var(--paper-2); border-radius: var(--r-pill); }
.edu-seg button {
  border: none; background: transparent; padding: 6px 12px; border-radius: var(--r-pill);
  font-family: var(--font-sans); font-weight: 600; font-size: 13px; color: var(--ink-2); cursor: pointer;
  transition: background-color .15s, color .15s;
}
.edu-seg button.active { background: var(--yellow); color: var(--yellow-ink); }

/* ─── Layout shell ─── */
main { max-width: 1100px; margin: 0 auto; padding: 34px 30px 70px; }

/* ─── Page header ─── */
.page-header { text-align: center; padding: 42px 0 48px; }
.app-title {
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(2rem, 4.5vw, 2.85rem); letter-spacing: -.025em;
  line-height: 1.05; color: var(--ink);
  margin: 0 0 16px;
}
.edu-lead { font-size: 1.0625rem; line-height: 1.6; color: var(--ink-2); margin: 0; }

/* ─── Type chip ─── */
.edu-chip {
  font-family: var(--font-mono); font-size: 11px; text-transform: uppercase;
  letter-spacing: .08em; padding: 4px 10px; border-radius: var(--r-pill);
  display: inline-block;
}
.chip-tool   { background: var(--blue-soft);   color: var(--blue-ink); }
.chip-webapp { background: var(--yellow-soft); color: var(--yellow-ink); }
.chip-edu    { background: var(--green-soft);  color: var(--green-ink); }
.chip-play   { background: var(--red-soft);    color: var(--red-ink); }

/* ─── Featured card ─── */
.featured {
  display: grid; grid-template-columns: 1.1fr 1fr;
  background: var(--surface); border-radius: var(--r-xl);
  box-shadow: var(--shadow-md); overflow: hidden;
  margin-bottom: 56px;
}
.featured-visual {
  position: relative; display: flex; align-items: center; justify-content: center;
  min-height: 300px; overflow: hidden;
}
.featured-visual .big-icon { width: 96px; height: 96px; color: var(--surface); }
.featured-visual .ghost-icon {
  position: absolute; right: -34px; bottom: -34px;
  width: 220px; height: 220px; color: rgba(255,255,255,.16);
}
.featured-pill {
  position: absolute; top: 20px; left: 22px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink);
  background: rgba(255,255,255,.9); padding: 5px 12px; border-radius: var(--r-pill);
}
.featured-body { padding: 40px 42px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.featured-body h2 {
  font-family: var(--font-display); font-weight: 700; font-size: 32px;
  letter-spacing: -.02em; line-height: 1.1; color: var(--ink);
}
.featured-body p { font-size: 16px; line-height: 1.6; color: var(--ink-2); max-width: 380px; }
.featured-cta { display: flex; align-items: center; gap: 16px; margin-top: 8px; }

.edu-btn {
  font-family: var(--font-display); font-weight: 600; font-size: 15px;
  background: var(--yellow); color: var(--on-primary); border: none; cursor: pointer;
  border-radius: var(--r-pill); padding: 12px 22px;
  box-shadow: var(--shadow-primary); display: inline-block;
  transition: transform .12s cubic-bezier(.32,.72,.32,1), background-color .15s;
}
.edu-btn:hover  { background: var(--yellow-600); }
.edu-btn:active { transform: scale(.96); }
.edu-meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; color: var(--ink-3); }

/* ─── Section heading ─── */
.section-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; }
.section-head h2 {
  font-family: var(--font-display); font-weight: 600; font-size: 25px;
  letter-spacing: -.01em; color: var(--ink);
}
.section-head .count { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }

/* ─── Demo card grid ─── */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.card {
  background: var(--surface); border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm); overflow: hidden; display: block;
  transition: all .2s cubic-bezier(.32,.72,.32,1); cursor: pointer;
}
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.card-head {
  position: relative; height: 128px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.card-head .icon { width: 40px; height: 40px; color: var(--surface); }
/* yellow heads carry dark ink, never white */
.card-head[data-dark] .icon, .featured-visual[data-dark] .big-icon { color: var(--ink); }
.card-head[data-dark] .ghost, .featured-visual[data-dark] .ghost-icon { color: rgba(28,25,23,.16); }
.card-head[data-dark] .edu-chip { background: var(--ink); color: var(--paper); } /* a yellow chip would vanish on a yellow head */
.card-head .ghost {
  position: absolute; right: -28px; bottom: -28px;
  width: 140px; height: 140px; color: rgba(255,255,255,.16);
}
.card-head .edu-chip { position: absolute; top: 12px; left: 14px; }
.card-body { padding: 16px 18px 18px; }
.card-body h3 {
  font-family: var(--font-display); font-weight: 600; font-size: 17px;
  color: var(--ink); margin-bottom: 6px;
}
.card-body p { font-size: 13.5px; line-height: 1.45; color: var(--ink-2); margin-bottom: 10px; }
.card-body .edu-meta { display: block; }

/* ─── Footer ─── */
footer {
  border-top: 1px solid var(--line);
  margin-top: 70px; padding: 26px 30px;
}
.footer-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-family: var(--font-mono); font-size: 12px; color: var(--ink-3);
}
.footer-inner a { color: var(--blue); }
.footer-inner a:hover { text-decoration: underline; }

/* ─── Responsive ─── */
@media (max-width: 768px) {
  .grid { grid-template-columns: 1fr; }
  .featured { grid-template-columns: 1fr; }
  .featured-visual { min-height: 200px; }
  .featured-body { padding: 28px 26px; }
  main { padding: 24px 20px 50px; }
}
@media (min-width: 769px) and (max-width: 1024px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

    lead: 'A small shelf of self-contained web apps: a slide-deck maker, generative sketching, AI-training blocks, conversation cards, and one overdramatic quiz. Everything runs in the browser, no build step.',
    featured: 'Featured',
    open: 'Open the app',
    allApps: 'All apps',
    count: n => `${n} apps`,
    openApp: name => `Open ${name}`,
    footer: 'edulab · app lab',
    docTitle: 'edulab · app lab',
    chip: { tool: 'Tool', webapp: 'Web app', edu: 'Edu', play: 'Play' },
  },
};
const CHIP_CLASS = { tool: 'chip-tool', webapp: 'chip-webapp', edu: 'chip-edu', play: 'chip-play' };
const YELLOW = '#FFD500'; /* matches --yellow: heads on this colour take dark ink */

// ─── State ───
const STATE = { lang: 'pl' };   // Polish is the default; the choice is remembered in localStorage
const MODEL = {
  featured: {
    title: 'doc2slide',
    desc: {
      pl: 'Z pliku Markdown, tekstu albo PDF robi prezentację, którą potem edytujesz w przeglądarce. Do wyboru trzy przestrzenie robocze, a jeśli chcesz, AI dorysuje ilustracje.',
      en: 'Turns Markdown, text, or PDF documents into editable slide decks in the browser. Three deck-first workspaces, zero build step, optional AI illustrations.',
    },
    kind: 'webapp',
    icon: 'presentation',
    color: '#1E8FC2', /* blue - matches --blue */
    meta: { pl: 'w przeglądarce · bez instalacji', en: 'browser · no build' },
    href: 'doc2slide/index.html',
  },
  apps: [
    { title: 'Sketchbook', desc: { pl: 'Arkusze szkiców, które rysuje kod: chwiejne pióro o zmiennej grubości kreśli twarze, całe postacie, zwierzaki, wzory tatuaży, rakiety i kosmitów oraz dziwne stworki.', en: 'Procedural sketch sheets drawn by code with a wobbly, tapered pen: faces, figures, critters, tattoo flash, space objects, and odd little creatures.' }, kind: 'play', icon: 'pen-tool', color: '#C6478B', meta: { pl: 'generatywne · canvas', en: 'generative · canvas' }, href: 'faces/index.html' },
    { title: 'Am I in a Story?', desc: { pl: 'Quiz, który sprawdza, jakim archetypem z opowieści jesteś. Celowo przerysowany i udający terminal survival horroru z końca lat 80., w grafice EGA.', en: 'A deliberately overdramatic story-archetype quiz presented as a late-1980s EGA survival-horror terminal.' }, kind: 'play', icon: 'ghost', color: '#7A5AC2', meta: { pl: 'quiz · retro DOS', en: 'quiz · retro DOS' }, href: 'story/index.html' },
    { title: 'Klocki AI', desc: { pl: 'Klocki do składania, na których widać krok po kroku, jak trenuje się model AI.', en: 'Edu blocks for explaining how an AI model is trained, one snap-together piece at a time.' }, kind: 'edu', icon: 'blocks', color: '#00A651', meta: { pl: 'workszop.org', en: 'workszop.org' }, href: 'https://workszop.org' },
    { title: 'DrawMe', desc: { pl: 'Ze zdjęcia twarzy robi szkic jak spod ręki rysownika. Działa jak portret pamięciowy: chwiejne pióro rysuje kandydatów, a model AI, który widzi obrazy, wybiera najlepszych.', en: 'Turns a head photo into a hand-drawn sketch portrait: a police-composite flow of wobbly-pen candidates scored by an AI vision judge.' }, kind: 'play', icon: 'brush', color: '#E5322D', meta: { pl: 'ze zdjęcia w szkic · ocenia ai', en: 'photo to sketch · ai judge' }, href: 'drawme/index.html' },
    { title: 'Image Anatomy Explorer', desc: { pl: 'Pokazuje, co siedzi w obrazku: metadane pliku, surowe bajty, kolor każdego piksela i to, co ginie przy zmniejszaniu.', en: 'Peeks inside an uploaded image: file metadata, raw bytes, and pixel-by-pixel colour values, plus what resizing really throws away.' }, kind: 'edu', icon: 'scan-search', color: '#1E8FC2', meta: { pl: 'metadane · piksele · bajty', en: 'metadata · pixels · bytes' }, href: 'img/index.html' },
    { title: 'BeeHonest', desc: { pl: 'Talia 52 kart do rozmowy. Pomagają lepiej poznać siebie i innych, bez stresu i bez skrępowania.', en: 'A deck of 52 conversation cards that help you get to know yourself and others. No stress, no awkwardness, just honest conversations.' }, kind: 'webapp', icon: 'messages-square', color: '#FFD500', meta: { pl: 'beehonest.eu', en: 'beehonest.eu' }, href: 'https://beehonest.eu' },
  ],
};

// ─── DOM refs ───
const langSegEl = document.getElementById('langSeg');
const gridEl = document.getElementById('grid');
const appCountEl = document.getElementById('appCount');
const featuredEl = document.getElementById('featured');

// ─── Helpers ───
function t(key) { return T[STATE.lang][key]; }
function tx(v) { return typeof v === 'string' ? v : v[STATE.lang]; }   // bilingual model field
function readLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved === 'pl' || saved === 'en') return saved;
  } catch (_) { /* storage blocked: fall through to the default */ }
  return 'pl';
}
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}
function chipEl(kind) {
  return el('span', `edu-chip ${CHIP_CLASS[kind]}`, t('chip')[kind]);
}
function iconEl(className, name) {
  const i = el('i', className);
  i.setAttribute('data-lucide', name);
  return i;
}

// ─── Render ───
function renderTexts() {
  document.documentElement.lang = STATE.lang;
  document.title = t('docTitle');
  for (const node of document.querySelectorAll('[data-t]')) node.textContent = t(node.dataset.t);
  for (const b of langSegEl.querySelectorAll('button')) {
    const on = b.dataset.lang === STATE.lang;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', String(on));
  }
}

function renderFeatured() {
  const f = MODEL.featured;
  featuredEl.href = f.href;
  const visual = document.getElementById('featuredVisual');
  visual.style.background = f.color;
  visual.toggleAttribute('data-dark', f.color.toUpperCase() === YELLOW);
  document.getElementById('featuredIcon').setAttribute('data-lucide', f.icon);
  document.getElementById('featuredGhost').setAttribute('data-lucide', f.icon);
  featuredEl.setAttribute('aria-label', t('openApp')(f.title));
  const chip = document.getElementById('featuredChip');
  chip.classList.add(CHIP_CLASS[f.kind]);
  chip.textContent = t('chip')[f.kind];
  document.getElementById('featuredTitle').textContent = f.title;
  document.getElementById('featuredDesc').textContent = tx(f.desc);
  document.getElementById('featuredMeta').textContent = tx(f.meta);
}

function renderGrid() {
  gridEl.textContent = '';
  for (const app of MODEL.apps) {
    const card = el('a', 'card');
    card.setAttribute('role', 'listitem');
    card.href = app.href;
    card.setAttribute('aria-label', t('openApp')(app.title));

    const head = el('div', 'card-head');
    head.style.background = app.color;
    head.toggleAttribute('data-dark', app.color.toUpperCase() === YELLOW);
    head.append(chipEl(app.kind), iconEl('icon', app.icon), iconEl('ghost', app.icon));

    const body = el('div', 'card-body');
    body.append(el('h3', '', app.title), el('p', '', tx(app.desc)), el('span', 'edu-meta', tx(app.meta)));

    card.append(head, body);
    gridEl.appendChild(card);
  }
  appCountEl.textContent = t('count')(MODEL.apps.length + 1);
}

function render() {
  renderTexts();
  renderFeatured();
  renderGrid();
  /* the CDN may be blocked or down: cards read fine without their decorative icons */
  if (window.lucide) lucide.createIcons();
  document.body.dataset.lang = STATE.lang;   // DOM contract for checks
}

// ─── Listeners ───
langSegEl.addEventListener('click', e => {
  const b = e.target.closest('button[data-lang]');
  if (!b || b.dataset.lang === STATE.lang) return;
  STATE.lang = b.dataset.lang;
  try { localStorage.setItem(LANG_KEY, STATE.lang); } catch (_) { /* storage blocked */ }
  render();
});

// ─── Init ───
STATE.lang = readLang();
render();
</script>
</body>
</html>
