<script src="tattoo.js"></script>
<script src="space.js"></script>
<script src="creatures.js"></script>
<script>
/* ============================================================
   MIX – one cell from any collection. The collections register
   themselves (Sheet.register in faces.js … space.js); this sheet
   only rolls which hand draws each cell and passes the pen.
   ============================================================ */
const MIX_WEIGHTS = { faces: 1, figures: 0.2, animals: 1, tattoo: 1, space: 1, creatures: 1 };   // figures kept rare
const MIX = Object.keys(MIX_WEIGHTS);
/* each collection gets its own salt, so the cell that picked it doesn't share its random stream —
   without this, the collection choice and the drawing's first roll would use the same number,
   and every mixed face (say) would land in the same corner of its own tables */
const SALT = Object.fromEntries(MIX.map((n, i) => [n, (0x9E3779B9 * (i + 1)) >>> 0]));

function drawMix(cx, cy, seed, { big = false } = {}) {
  pen.seed(seed);
  pen.phase('silhouette');                 // which hand draws the cell is part of its silhouette: locked with it while varying
  const name = pooled(MIX_WEIGHTS);        // dealt from the sheet's deck, so every hand gets its share
  const cfg = COLLECTIONS[name];
  /* the drawing is seeded with its collection's salt; a locked phase must reach the same salted stream */
  const lockBase = pen.lockBase;
  if (lockBase != null) pen.lockBase = (lockBase ^ SALT[name]) >>> 0;
  pen.pool = null;                         // the inner hand rolls its own motif
  pen.ctx.save();
  if (big && (cfg.zoom || 1) !== 1) pen.ctx.scale(cfg.zoom, cfg.zoom);   // each collection keeps its own viewer magnification
  let who;
  try { who = cfg.draw(cx, cy, (seed ^ SALT[name]) >>> 0, { big }) || {}; }
  finally { pen.ctx.restore(); pen.lockBase = lockBase; }
  return { c: name, ...who };
}

Sheet.init({ name: 'mix', H: 2420, draw: drawMix, census: ['c'], zoom: 1, pool: MIX_WEIGHTS,
             locks: ['silhouette', 'expression', 'palette', 'accessories'] });
</script>
