<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DrawMe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="edu">
  <header class="edu-header"><div class="edu-header-inner">
    <img class="edu-logo" alt="edulab" src="edulab-mark-ink.png">
    <span class="edu-wordmark">edulab</span>
    <div class="header-controls" id="header-controls"></div>
  </div></header>

  <section class="hero edu-block">
    <svg class="hero-ghost" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m11 10 3 3"/><path d="M6.5 21A3.5 3.5 0 1 0 3 17.5a2.62 2.62 0 0 1-.708 1.792A1 1 0 0 0 3 21z"/><path d="M9.969 17.031 21.378 5.624a1 1 0 0 0-3.002-3.002L6.967 14.031"/></svg>
    <header class="page-header">
      <h1 class="app-title">DrawMe</h1>
      <p class="edu-lead">Turns a head photo into a hand-drawn sketch portrait: candidates drawn by a wobbly pen, judged by an AI vision model.</p>
    </header>
  </section>

  <div class="work-band">
    <main id="app" data-state="idle" data-phase="" data-provider=""></main>
  </div>

  <div id="live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <footer class="edu-footer" id="footer-hint">Keyboard shortcuts: 1-9 and 0 / - / = pick a candidate (cells 10-12), Space pauses or resumes, Enter advances the review now, S saves the portrait once done.</footer>

  <div id="probes" style="display:none"></div>

  <script src="pen.js"></script>
  <script src="genome.js"></script>
  <script src="ai-models.js"></script>
  <script src="app.js"></script>
</body>
</html>
